name: wtg_test

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: wtg_test_app
    user: "1000:1000"
    volumes:
      - ./:/var/www/html
    environment:
      HOME: /tmp
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wtg_test_network

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: wtg_test_queue
    user: "1000:1000"
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - ./:/var/www/html
    environment:
      HOME: /tmp
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wtg_test_network

  nginx:
    image: nginx:stable-alpine
    container_name: wtg_test_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - wtg_test_network

  mysql:
    image: mysql:8.0
    container_name: wtg_test_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - wtg_test_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wtg_test_network

  redis:
    image: redis:7-alpine
    container_name: wtg_test_redis
    restart: unless-stopped
    volumes:
      - wtg_test_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wtg_test_network

  adminer:
    image: adminer
    container_name: wtg_test_adminer
    ports:
      - "8082:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wtg_test_network

networks:
  wtg_test_network:
    name: wtg_test_network

volumes:
  wtg_test_mysql_data:
    name: wtg_test_mysql_data
  wtg_test_redis_data:
    name: wtg_test_redis_data
